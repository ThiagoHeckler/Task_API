# Perfil de produção (VPS, SPRING_PROFILES_ACTIVE=prod). Sobrescreve só o que muda no deploy.
server:
  port: 8080

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      # VPS com um PostgreSQL compartilhado por vários apps (max_connections=60)
      maximum-pool-size: 5

jwt:
  # Sem valor padrão: em produção a API não sobe sem o segredo real.
  secret: ${JWT_SECRET}
