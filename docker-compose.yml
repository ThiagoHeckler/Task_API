services:
  db:
    image: postgres:18-alpine
    container_name: taskapi-db
    environment:
      POSTGRES_DB: taskapi
      POSTGRES_USER: ${DB_USER:-thiago}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-thiago}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - taskapi-data:/var/lib/postgresql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d taskapi"]
      interval: 5s
      retries: 10

volumes:
  taskapi-data:
